[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-online-industry-tracker"
version = "0.2.0"
description = "Python tools + Flask/Streamlit app to track EVE Online industry data"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "jveyc"}]

dynamic = ["dependencies"]

[project.scripts]
eve-online-industry-tracker = "eve_online_industry_tracker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "utils*",
  "flask_app*",
  "streamlit_ui*",
  "config*",
  "eve_online_industry_tracker*",
]

[tool.pytest.ini_options]
# -rs: the summary names every skip, e.g. the git-ignored local SDE or overview fixture is missing.
addopts = "-rs"
markers = [
    "needs_local_sde: skipped when database/eve_sde.db is not present",
    "needs_overview_fixture: skipped when tests/fixtures/overview_rows_real.json is not present",
]
